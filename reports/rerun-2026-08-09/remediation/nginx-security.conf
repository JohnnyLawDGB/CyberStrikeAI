# =============================================================================
# DigiScope nginx hardening — addresses FIND-02, FIND-03, FIND-04, FIND-06
# and serves the public security page (/security) + /.well-known/security.txt.
#
# HOW TO USE
#   1. Put security-page.html at:   /var/www/digiscope-security/security.html
#      and security.txt at:         /var/www/digiscope-security/.well-known/security.txt
#      (adjust paths to match your repo/deploy layout).
#   2. Include the header snippet below inside the HTTPS `server {}` block for
#      digiscope.me (and api.digiscope.me where noted).
#   3. Add the www->apex redirect server block.
#   4. Test + reload:   nginx -t && systemctl reload nginx
#
# NOTE on add_header inheritance: a directive-level `add_header` inside a
# nested `location {}` DROPS all headers inherited from the server block.
# Keep these at server scope, and if you must add headers in a location,
# re-include this whole snippet there.
# =============================================================================

# ---- Security response headers (put inside the HTTPS server block) ----------

# FIND-04: HSTS with preload, standardized to 1 year on ALL hosts (web + api).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# FIND-03: cross-origin + misc hardening headers.
add_header X-Content-Type-Options            "nosniff"                         always;
add_header X-Frame-Options                   "DENY"                            always;   # keep alongside CSP frame-ancestors
add_header Referrer-Policy                   "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none"                            always;
add_header Permissions-Policy                "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy         "same-origin"                    always;
add_header Cross-Origin-Resource-Policy       "same-origin"                    always;
# COEP can break third-party embeds/images — roll out carefully and test the app:
# add_header Cross-Origin-Embedder-Policy     "require-corp"                    always;

# FIND-02: Content-Security-Policy.
# ---- Phase 1: deploy REPORT-ONLY first, watch the console/report endpoint,
#      then promote to the enforcing header once no legitimate resource breaks.
# React/Vite SPA note: if you have any inline <script>, add its sha256 hash or a
# per-response nonce to script-src. 'unsafe-inline' is only kept for styles here.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.digiscope.me; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
# ---- Phase 2 (after validation): swap the line above for the enforcing one:
# add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.digiscope.me; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;

# ---- Public security page + security.txt (serve inside the same server block) -
location = /security {
    default_type text/html;
    alias /var/www/digiscope-security/security.html;
}
location = /.well-known/security.txt {
    default_type text/plain;
    alias /var/www/digiscope-security/.well-known/security.txt;
}

# ---- FIND-06: canonicalize www -> apex (separate server block) ----------------
# Replace your current www vhost (which serves 200) with a 301 redirect.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.digiscope.me;

    # reuse the same certificate (SAN already covers www)
    ssl_certificate     /etc/letsencrypt/live/digiscope.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/digiscope.me/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    return 301 https://digiscope.me$request_uri;
}
